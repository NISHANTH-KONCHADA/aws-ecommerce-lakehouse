# ==============================================================================
# AWS E-Commerce Data Lake Configuration
# ==============================================================================

pipeline:
  name: "aws-ecommerce-lakehouse"
  version: "1.0.0"
  description: "Batch ETL Data Lake for Olist E-Commerce dataset"

# Data lake logical storage paths
storage:
  s3_bucket: "ecommerce-data-lake-raw"  # Overridden by .env if set
  zones:
    bronze: "bronze"
    silver: "silver"
    gold: "gold"
    quarantine: "quarantine"
    manifests: "manifests"
    athena_results: "athena-results"

# Source dataset definitions & schema expectations
datasets:
  orders:
    source_file: "olist_orders_dataset.csv"
    silver_table: "orders"
    primary_key: ["order_id"]
    mandatory_columns:
      - "order_id"
      - "customer_id"
      - "order_status"
      - "order_purchase_timestamp"
    timestamp_columns:
      - "order_purchase_timestamp"
      - "order_approved_at"
      - "order_delivered_carrier_date"
      - "order_delivered_customer_date"
      - "order_estimated_delivery_date"
    partition_by: ["year", "month"]

  order_items:
    source_file: "olist_order_items_dataset.csv"
    silver_table: "order_items"
    primary_key: ["order_id", "order_item_id"]
    foreign_keys:
      order_id: "orders.order_id"
      product_id: "products.product_id"
      seller_id: "sellers.seller_id"
    mandatory_columns:
      - "order_id"
      - "order_item_id"
      - "product_id"
      - "seller_id"
      - "price"
      - "freight_value"
    numeric_columns:
      price: "float"
      freight_value: "float"

  payments:
    source_file: "olist_order_payments_dataset.csv"
    silver_table: "payments"
    primary_key: ["order_id", "payment_sequential"]
    mandatory_columns:
      - "order_id"
      - "payment_sequential"
      - "payment_type"
      - "payment_installments"
      - "payment_value"
    numeric_columns:
      payment_sequential: "int"
      payment_installments: "int"
      payment_value: "float"

  customers:
    source_file: "olist_customers_dataset.csv"
    silver_table: "customers"
    primary_key: ["customer_id"]
    mandatory_columns:
      - "customer_id"
      - "customer_unique_id"
      - "customer_zip_code_prefix"
      - "customer_city"
      - "customer_state"

  products:
    source_file: "olist_products_dataset.csv"
    silver_table: "products"
    primary_key: ["product_id"]
    mandatory_columns:
      - "product_id"
      - "product_category_name"

  sellers:
    source_file: "olist_sellers_dataset.csv"
    silver_table: "sellers"
    primary_key: ["seller_id"]
    mandatory_columns:
      - "seller_id"
      - "seller_zip_code_prefix"
      - "seller_city"
      - "seller_state"

  reviews:
    source_file: "olist_order_reviews_dataset.csv"
    silver_table: "reviews"
    primary_key: ["review_id"]
    mandatory_columns:
      - "review_id"
      - "order_id"
      - "review_score"
    timestamp_columns:
      - "review_creation_date"
      - "review_answer_timestamp"

  category_translation:
    source_file: "product_category_name_translation.csv"
    silver_table: "category_translation"
    primary_key: ["product_category_name"]
    mandatory_columns:
      - "product_category_name"
      - "product_category_name_english"

# Validation & Data Quality Thresholds
data_quality:
  min_payment_value: 0.0
  min_review_score: 1
  max_review_score: 5
  allowed_order_statuses:
    - "delivered"
    - "shipped"
    - "canceled"
    - "invoiced"
    - "processing"
    - "created"
    - "approved"
    - "unavailable"
